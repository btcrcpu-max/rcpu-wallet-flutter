name: rcpu_wallet
description: RCPU 手机钱包 - 原生 RCPU（明文+CT）与 BSC wRCPU 双链钱包
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  dio: ^5.7.0
  uuid: ^4.5.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Path C HKDF/ECDH 单测（test/tc_sig02_hkdf_test.dart）依赖
  pointycastle: ^3.7.3

flutter:
  uses-material-design: true