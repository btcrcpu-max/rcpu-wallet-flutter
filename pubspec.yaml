name: rcpu_wallet
description: RCPU 手机钱包 - 原生 RCPU（明文+CT）与 BSC wRCPU 双链钱包
publish_to: 'none'
version: 0.4.6+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  dio: ^5.7.0
  uuid: ^4.5.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  # Path C 原语：SHA256/RIPEMD160(HASH160)、secp256k1 曲线、BIP340 Schnorr、HKDF
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true