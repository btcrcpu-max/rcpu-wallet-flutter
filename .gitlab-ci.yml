# RCPU Wallet —— GitLab CI/CD
#
# 覆盖阶段（与 .github/workflows/ci.yml 同一套能力）：
#   1. flutter analyze + flutter test
#   2. APK 构建（有签名变量时构建 signed release，否则 debug 兜底）
#   3. 签名检查（apksigner 优先，keytool 兜底；产物来自 build 阶段 artifacts）
#   4. 产物上传（GitLab 原生 artifacts 机制，本文件通过 artifacts: 声明即上传）
#
# 签名变量（Settings > CI/CD > Variables，Protected 建议开启，勿写明文）：
#   ANDROID_KEYSTORE_B64  - android/rcpu-release.jks 的 base64（`base64 -w0 android/rcpu-release.jks`）
#   KEYSTORE_PASSWORD     - storePassword
#   KEY_PASSWORD          - keyPassword
#   KEY_ALIAS             - keyAlias（默认 rcpu）
#   未配置变量时流水线仍可运行（构建 debug APK），签名检查步骤显式报告缺失。
#
# 版本口径：pubspec.yaml sdk >=3.3.0 <4.0.0，镜像 cirruslabs/flutter:3.22.4
# （也可换 ghcr.io/cirruslabs/flutter:3.22.4 或 stable，需保证 Flutter 版本匹配）。

image: cirrusci/flutter:3.22.4

stages:
  - test
  - build
  - verify

variables:
  # 统一 Dart 包缓存，加快各阶段 pub get
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key:
    files:
      - pubspec.lock
    prefix: flutter
  paths:
    - .pub-cache/

before_script:
  - flutter pub get

# ------------------------------------------------------------------ #
# 阶段 1：静态检查 + 单测（阻塞项按 C1-C4 skip，流水线可直接通过）      #
# ------------------------------------------------------------------ #
test:
  stage: test
  script:
    - flutter analyze
    - flutter test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# ------------------------------------------------------------------ #
# 阶段 1b：TC-SIG-03 专项测试（占位实现下两条用例应全部通过）           #
# 运行依赖 before_script 的 flutter pub get；产出 test/ 供后续追溯      #
# ------------------------------------------------------------------ #
tc-sig03:
  stage: test
  script:
    - flutter test test/tc_sig03_test.dart --reporter expanded
  artifacts:
    when: always
    paths:
      - test/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# ------------------------------------------------------------------ #
# 阶段 2：APK 构建（签名变量就绪 -> release；否则 debug 兜底）          #
# 产物通过 artifacts 上传（等同 GitHub upload-artifact）               #
# ------------------------------------------------------------------ #
build:
  stage: build
  needs: ["test"]
  script:
    # 签名配置检查：四个变量齐全才注入 keystore 与 key.properties
    - |
      if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
        echo "==> signing: enabled"
        echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/rcpu-release.jks
        cat > android/key.properties <<EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=${KEY_ALIAS:-rcpu}
        storeFile=rcpu-release.jks
        EOF
        test -s android/rcpu-release.jks
        test -f android/key.properties
        flutter build apk --release
      else
        echo "==> signing: missing (WARN: 构建 debug APK，签名检查步骤将报告缺失)"
        flutter build apk --debug
      fi
  artifacts:
    name: "rcpu-wallet-apk-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expose_as: rcpu_apks
    expire_in: 14 days
    when: always

# ------------------------------------------------------------------ #
# 阶段 3：签名检查（产物来自 build 阶段 artifacts）                    #
# ------------------------------------------------------------------ #
verify-signature:
  stage: verify
  needs: ["build"]
  script:
    - set -e
    - |
      for APK in build/app/outputs/flutter-apk/*.apk; do
        test -f "$APK"
        echo "==> verify: $APK"
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
        if [ -n "$APKSIGNER" ]; then
          "$APKSIGNER" verify --print-certs "$APK"
        else
          keytool -printcert -jarfile "$APK"
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG'